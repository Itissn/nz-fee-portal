name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Streamlit app syntax
        run: |
          python -m py_compile app/streamlit_app.py

      - name: Check required files
        run: |
          test -f app/streamlit_app.py
          test -f requirements.txt
          test -f README.md
          test -f data/processed/programme_index.csv

      - name: Run tests
        run: |
          pytest

      - name: Build SQLite database
        run: |
          python scripts/build_database.py

      - name: Generate data quality report
        run: |
          python scripts/data_quality_report.py --report-path reports/ci_data_quality_report.md

      - name: Upload data quality report
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: reports/ci_data_quality_report.md