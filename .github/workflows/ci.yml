name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/build_database.py
      - run: python scripts/data_quality_report.py
      - name: Verify published snapshot report
        run: git diff --exit-code -- reports/data_quality_report.md
